name: Release CDN component

# Publishes a Tier 1 component to jsDelivr by creating an immutable git tag
# that consumers (e.g. Josverl/ViperIDE) pin against. See docs/cdn-consumption.md.
#
# Two independently versioned components:
#   - lsp-client     → tag `lsp-client-v<version>` (pure source, already in git)
#   - pyright-worker → tag `pyright-worker-v<version>` (carries built dist/pyright_worker.js)
#
# Tags are immutable: a version that already exists is never moved — cut a new one.
# Manual dispatches may target a feature branch so a release candidate can be
# exercised through jsDelivr before its PR is merged.

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to release
        type: choice
        required: true
        options:
          - lsp-client
          - pyright-worker
      version:
        description: Semver without prefix, e.g. 0.1.0 (must match the component package.json)
        type: string
        required: true
  push:
    tags:
      # Bootstrap releases before this workflow has reached the default branch.
      - cdn-release/lsp-client/*
      - cdn-release/pyright-worker/*

permissions:
  contents: write

concurrency:
  group: release-cdn-${{ github.event.inputs.component || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # Deleting a failed or successfully consumed request tag must not publish.
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag and validate inputs
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMPONENT_INPUT: ${{ github.event.inputs.component }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$RELEASE_REF_TYPE" != "branch" ]; then
              echo "::error::Manual releases must be dispatched from a branch, not $RELEASE_REF_TYPE '$RELEASE_REF'."
              exit 1
            fi
            component="$COMPONENT_INPUT"
            version="$VERSION_INPUT"
            source_ref="$RELEASE_REF"
          else
            case "$RELEASE_REF" in
              cdn-release/lsp-client/*)
                component='lsp-client'
                version="${RELEASE_REF#cdn-release/lsp-client/}"
                ;;
              cdn-release/pyright-worker/*)
                component='pyright-worker'
                version="${RELEASE_REF#cdn-release/pyright-worker/}"
                ;;
              *)
                echo "::error::Unsupported release request tag '$RELEASE_REF'."
                exit 1
                ;;
            esac
            source_ref="$RELEASE_REF"
          fi

          # Basic semver shape check (X.Y.Z with optional -prerelease).
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$version' is not a valid semver (expected e.g. 0.1.0)"
            exit 1
          fi

          case "$component" in
            lsp-client)     pkg='src/lsp/package.json' ;;
            pyright-worker) pkg='src/worker/package.json' ;;
            *) echo "::error::Unknown component '$component'"; exit 1 ;;
          esac

          # Enforce that package.json on the selected source branch owns the
          # version being tagged.
          pkg_version=$(node -p "require('./$pkg').version")
          if [ "$pkg_version" != "$version" ]; then
            echo "::error::$pkg version ($pkg_version) does not match input version ($version). Bump it in a PR first."
            exit 1
          fi

          tag="${component}-v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists — tags are immutable. Cut a new version."
            exit 1
          fi

          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version"     >> "$GITHUB_OUTPUT"
          echo "tag=$tag"             >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.meta.outputs.component == 'pyright-worker'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install uv
        if: steps.meta.outputs.component == 'pyright-worker'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Node.js dependencies
        if: steps.meta.outputs.component == 'pyright-worker'
        run: npm ci --ignore-scripts

      - name: Verify worker protocol declarations
        if: steps.meta.outputs.component == 'pyright-worker'
        run: npm run check:worker-protocol-types

      - name: Pack typeshed and board stubs
        if: steps.meta.outputs.component == 'pyright-worker'
        run: |
          uv run scripts/pack-typeshed.py
          uv run scripts/pack-stubs.py

      - name: Build worker
        if: steps.meta.outputs.component == 'pyright-worker'
        run: npx webpack --mode production

      - name: Verify worker artifact
        if: steps.meta.outputs.component == 'pyright-worker'
        run: |
          set -euo pipefail
          if [ ! -s dist/pyright_worker.js ]; then
            echo "::error::dist/pyright_worker.js missing or empty"
            exit 1
          fi
          echo "pyright_worker.js: $(stat -c%s dist/pyright_worker.js) bytes"

      - name: Configure git identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create pyright-worker release commit (carries built artifacts)
        if: steps.meta.outputs.component == 'pyright-worker'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # dist/ is gitignored on main; force-add only for this tag's tree.
          git add -f dist/pyright_worker.js dist/pyright_worker.js.LICENSE.txt
          # assets/*.zip are tracked; include any freshly packed changes.
          git add assets
          git commit -m "release(pyright-worker): v${VERSION} [skip ci]"

      - name: Create and push tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "$TAG"
          # Push only the tag ref; the release commit (if any) is reachable
          # solely via the tag, keeping main's history clean.
          git push origin "refs/tags/${TAG}"

      - name: Warm jsDelivr cache
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          COMPONENT: ${{ steps.meta.outputs.component }}
        run: |
          set -uo pipefail
          if [ "$COMPONENT" = "lsp-client" ]; then
            paths='src/lsp/index.js'
          else
            paths='dist/pyright_worker.js assets/stubs-manifest.json'
          fi
          for p in $paths; do
            url="https://purge.jsdelivr.net/gh/${REPO}@${TAG}/${p}"
            echo "Purging/warming: $url"
            curl -fsSL "$url" >/dev/null || echo "::warning::jsDelivr warm failed for $p (non-fatal)"
          done

      - name: Remove bootstrap request tag
        if: github.event_name == 'push'
        env:
          REQUEST_TAG: ${{ github.ref_name }}
        run: git push origin ":refs/tags/${REQUEST_TAG}"

      - name: Summary
        env:
          COMPONENT: ${{ steps.meta.outputs.component }}
        run: |
          {
            echo "### Released \`${{ steps.meta.outputs.tag }}\`"
            echo ""
            echo "Source: \`${{ steps.meta.outputs.source_ref }}\` at \`${{ steps.meta.outputs.source_sha }}\`"
            echo ""
            echo "Consumers can pin:"
            echo ""
            if [ "$COMPONENT" = 'lsp-client' ]; then
              echo "\`\`\`"
              echo "https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.meta.outputs.tag }}/src/lsp/index.js"
              echo "\`\`\`"
            else
              echo "\`\`\`"
              echo "https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.meta.outputs.tag }}/dist/pyright_worker.js"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
