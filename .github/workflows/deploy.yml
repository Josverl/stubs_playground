name: Deploy to GitHub Pages

on:
  # Deploy only after Tests workflow succeeds on main
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy if tests passed (or manual trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: extractions/setup-just@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Pack typeshed
        run: uv run scripts/pack-typeshed.py

      - name: Pack board stubs
        run: uv run scripts/pack-stubs.py

      - name: Build worker
        run: npx webpack --mode production

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          worker='packages/pyright-worker/dist/pyright_worker.js'
          if [ ! -f "$worker" ] || [ ! -s "$worker" ]; then
            echo "ERROR: $worker missing or empty"
            exit 1
          fi
          echo "pyright_worker.js: $(stat -c%s "$worker") bytes"

      - name: Prepare deploy directory
        run: just stage-pages

      - name: Verify deploy tree
        run: |
          set -euo pipefail
          for path in \
            deploy/index.html \
            deploy/apps/playground/index.html \
            deploy/apps/playground/component-config.generated.js \
            deploy/apps/playground/component-source.js \
            deploy/packages/lsp-client/src/index.js \
            deploy/packages/pyright-worker/dist/pyright_worker.js \
            deploy/packages/pyright-worker/assets/stubs-manifest.json \
            deploy/packages/pyright-worker/assets/stubs-esp32.zip
          do
            test -s "$path" || { echo "::error::$path missing or empty"; exit 1; }
          done

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: './deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
