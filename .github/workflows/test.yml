name: Tests

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build Sphinx documentation
        run: uv run --with-requirements docs/requirements.txt sphinx-build -W --keep-going -b html docs docs/_build/html

  application-unit-tests:
    # Playground-owned unit tests. Component internals are tested separately.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Verify generated component config
        run: node scripts/generate-component-config.mjs --check

      - name: Verify application and component test boundaries
        run: npm run check:test-boundaries

      - name: Run playground unit tests
        run: npm run test:app:unit

  component-unit-tests:
    # Published package tests run without loading any playground modules.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python dependencies
        run: uv sync --extra test

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Run LSP client and worker contract tests
        run: npm run test:components:unit

      - name: Run worker packaging tests
        run: uv run pytest packages/pyright-worker/tests -m unit -v

  security-audit:
    # Tier 0: Check npm dependencies for known vulnerabilities.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit
        run: npm audit --omit=dev || true

  worker-build:
    # Build the worker once and share it across browser matrix jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - uses: extractions/setup-just@v4

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Verify worker protocol declarations
        run: npm run check:worker-protocol-types

      - name: Sync stub package catalog
        run: npm run sync:stub-package-catalog

      - name: Build worker
        run: |
          npx webpack --mode production
          npm run generate:runtime-manifest

      - name: Verify GitHub Pages staging
        run: |
          just stage-pages ci-deploy
          for path in \
            ci-deploy/index.html \
            ci-deploy/apps/playground/index.html \
            ci-deploy/apps/playground/component-config.generated.js \
            ci-deploy/apps/playground/component-source.js \
            ci-deploy/packages/lsp-client/src/index.js \
            ci-deploy/packages/pyright-worker/dist/pyright_worker.js \
            ci-deploy/packages/pyright-worker/assets/runtime-manifest.json \
            ci-deploy/packages/pyright-worker/assets/stubs-manifest.json \
            ci-deploy/packages/pyright-worker/assets/stubs-esp32.zip
          do
            test -s "$path" || { echo "::error::$path missing or empty"; exit 1; }
          done

      - name: Upload worker artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyright-worker-dist
          path: packages/pyright-worker/dist/pyright_worker.js
          if-no-files-found: error

  application-browser-tests:
    # The playground verifies rendered behavior and public component interfaces.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
      options: --user 1001
    needs: [worker-build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download worker artifact
        uses: actions/download-artifact@v8
        with:
          name: pyright-worker-dist
          path: packages/pyright-worker/dist

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Verify Playwright container version
        run: uv run python -c "from importlib.metadata import version; actual = version('playwright'); assert actual == '1.55.0', f'Playwright {actual} does not match container v1.55.0'"

      - name: Run suite tests
        run: uv run pytest apps/playground/tests -v --browser "${{ matrix.browser }}"

  component-browser-tests:
    # Package-owned harnesses test published components without the playground.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
      options: --user 1001
    needs: [worker-build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download worker artifact
        uses: actions/download-artifact@v8
        with:
          name: pyright-worker-dist
          path: packages/pyright-worker/dist

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Verify Playwright container version
        run: uv run python -c "from importlib.metadata import version; actual = version('playwright'); assert actual == '1.55.0', f'Playwright {actual} does not match container v1.55.0'"

      - name: Run component browser tests
        run: uv run pytest packages/lsp-client/tests -v -m "not published" --browser "${{ matrix.browser }}"
