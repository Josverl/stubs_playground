[project]
name = "viper-tools-stubs"
version = "0.1.2.0"
description = "Type stubs for the MicroPython modules bundled with ViperIDE"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jos Verlinde", email = "josverl@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Typing :: Stubs Only",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vshymanskyy/ViperIDE"
Repository = "https://github.com/Josverl/stubs_playground"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "hatchling>=1.27",
    "mypy==2.3.1",
    "pytest>=8",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"stubs/ble_nus" = "ble_nus"
"stubs/ble_repl" = "ble_repl"
"stubs/web_repl" = "web_repl"
"stubs/ws_client" = "ws_client"
"stubs/wss_repl" = "wss_repl"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/scripts",
    "/stubs",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["PYI"]
ignore = [
    "PYI021", # Preserve useful upstream docstrings generated by stubgen.
]
