<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Worker Transport Tests</title>
</head>

<body>
    <pre id="log"></pre>
    <script type="module">
        import {startWorkerRuntime} from '../src/runtime-loader.js';
        import {WorkerTransport} from '../src/worker-transport.js';
        import {SimpleLSPClient} from '../src/simple-client.js';

        function log(msg) {
            document.getElementById('log').textContent += msg + '\n';
        }

        async function sha256(data) {
            const digest = await crypto.subtle.digest('SHA-256', data);
            return Array.from(
                new Uint8Array(digest),
                (byte) => byte.toString(16).padStart(2, '0'),
            ).join('');
        }

        async function verifiedData(url) {
            const response = await fetch(url);
            const data = await response.arrayBuffer();
            return {data, size: data.byteLength, sha256: await sha256(data)};
        }

        async function verifiedUrl(url) {
            const source = await verifiedData(url);
            return {
                url: new URL(url, location.href).href,
                size: source.size,
                sha256: source.sha256,
                allowedOrigins: [location.origin],
            };
        }

        // Helper: connect transport + do LSP init + return {transport, initResponse}
        async function connectAndInit(transport) {
            await transport.connect();

            const initResponse = await new Promise((resolve, reject) => {
                const timeout = setTimeout(() => reject(new Error('LSP init timeout')), 15000);
                transport.subscribe((msgStr) => {
                    const msg = JSON.parse(msgStr);
                    if (msg.id === 1 && msg.result) {
                        clearTimeout(timeout);
                        resolve(msg);
                    }
                });
                transport.send(JSON.stringify({
                    jsonrpc: '2.0', id: 1, method: 'initialize',
                    params: {
                        processId: null, rootUri: 'file:///workspace',
                        capabilities: {textDocument: {publishDiagnostics: {relatedInformation: true}}},
                        workspaceFolders: [{uri: 'file:///workspace', name: 'workspace'}],
                    },
                }));
            });

            // Send initialized notification
            transport.send(JSON.stringify({jsonrpc: '2.0', method: 'initialized', params: {}}));
            return {transport, initResponse};
        }

        const tests = {
            async connect() {
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                await t.connect();
                const result = {
                    success: true,
                    connected: t.isConnected(),
                    protocolVersion: t.protocolVersion,
                    capabilities: [...t.capabilities],
                };
                t.close();
                return result;
            },

            async 'no-board-default'() {
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                await t.connect();
                const filesystem = await t.debugListFs('/typings', 1);
                t.close();
                return {
                    success: true,
                    fileCount: filesystem.entries.filter((entry) => entry.kind === 'file').length,
                };
            },

            async 'legacy-board-default'() {
                const worker = new Worker('../../pyright-worker/dist/pyright_worker.js');
                const entries = await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error('Legacy worker init timeout')), 15000);
                    worker.onmessage = (event) => {
                        const message = event.data;
                        if (message.type === 'serverLoaded') {
                            worker.postMessage({
                                type: 'initServer',
                                userFiles: {},
                                boardStubs: undefined,
                            });
                        } else if (message.type === 'serverInitialized') {
                            worker.postMessage({
                                type: 'debugListFs',
                                requestId: 'legacy-board-default',
                                root: '/typings',
                                depth: 1,
                            });
                        } else if (
                            message.type === 'debugListFsResult'
                            && message.requestId === 'legacy-board-default'
                        ) {
                            clearTimeout(timeout);
                            resolve(message.entries);
                        } else if (message.type === 'serverError') {
                            clearTimeout(timeout);
                            reject(new Error(message.error));
                        }
                    };
                });
                worker.terminate();
                return {
                    success: true,
                    hasMachineStubs: entries.some((entry) => entry.path.endsWith('/machine.pyi')),
                };
            },

            async 'verified-external-assets'() {
                const catalog = await verifiedData(
                    '../../pyright-worker/assets/micropython-stub-package-catalog.json',
                );
                const board = await verifiedUrl(
                    '../../pyright-worker/assets/stubs-esp32.zip',
                );
                const overlay = await verifiedData(
                    '../../pyright-worker/assets/stubs-rp2.zip',
                );
                const transport = new WorkerTransport(
                    '../../pyright-worker/dist/pyright_worker.js',
                    {
                        boardStubs: false,
                        boardStubsArchive: board,
                        stubPackageCatalog: catalog,
                        extraStubArchives: [{
                            packageName: 'viper-tools-stubs',
                            archive: overlay,
                        }],
                    },
                );
                await transport.connect();
                const typings = await transport.debugListFs('/typings', 1);
                const extras = await transport.debugListFs('/extra/viper-tools-stubs', 2);
                transport.close();
                return {
                    success: true,
                    assetFallbacks: transport.assetFallbacks,
                    boardMounted: typings.entries.some((entry) => entry.path.endsWith('/machine.pyi')),
                    overlayMounted: extras.entries.some(
                        (entry) => entry.path.endsWith('/machine.pyi'),
                    ),
                };
            },

            async 'rejected-external-assets-fall-back'() {
                const bundled = await verifiedData('../../pyright-worker/assets/stubs-rp2.zip');
                const transport = new WorkerTransport(
                    '../../pyright-worker/dist/pyright_worker.js',
                    {
                        boardStubs: bundled.data,
                        boardStubsArchive: {
                            url: 'https://example.invalid/stubs.zip',
                            size: bundled.size,
                            sha256: bundled.sha256,
                            allowedOrigins: [location.origin],
                        },
                        stubPackageCatalog: {
                            ...await verifiedData(
                                '../../pyright-worker/assets/micropython-stub-package-catalog.json',
                            ),
                            sha256: '0'.repeat(64),
                        },
                    },
                );
                await transport.connect();
                const typings = await transport.debugListFs('/typings', 1);
                transport.close();
                return {
                    success: true,
                    assetFallbacks: transport.assetFallbacks,
                    fallbackMounted: typings.entries.some(
                        (entry) => entry.path.endsWith('/machine.pyi'),
                    ),
                };
            },

            async 'invalid-catalog-variants-fall-back'() {
                const invalidCatalog = new TextEncoder().encode('{}').buffer;
                const wrongVersionCatalog = new TextEncoder().encode(JSON.stringify({
                    version: '1.0',
                    availableRuntimeVersions: ['1.26'],
                    defaultRuntimeVersion: '1.26',
                    packages: [],
                })).buffer;
                const cases = [
                    {
                        name: 'oversized',
                        source: {
                            data: invalidCatalog,
                            size: 3 * 1024 * 1024,
                            sha256: await sha256(invalidCatalog),
                        },
                    },
                    {
                        name: 'incompatible',
                        source: {
                            data: invalidCatalog,
                            size: invalidCatalog.byteLength,
                            sha256: await sha256(invalidCatalog),
                        },
                    },
                    {
                        name: 'wrong-version',
                        source: {
                            data: wrongVersionCatalog,
                            size: wrongVersionCatalog.byteLength,
                            sha256: await sha256(wrongVersionCatalog),
                        },
                    },
                ];
                const errors = {};
                for (const testCase of cases) {
                    const transport = new WorkerTransport(
                        '../../pyright-worker/dist/pyright_worker.js',
                        {
                            boardStubs: false,
                            stubPackageCatalog: testCase.source,
                        },
                    );
                    await transport.connect();
                    errors[testCase.name] = transport.assetFallbacks[0]?.error;
                    transport.close();
                }
                return {success: true, errors};
            },

            async 'catalog-redirects-are-rejected'() {
                const catalog = await verifiedData(
                    '../../pyright-worker/assets/micropython-stub-package-catalog.json',
                );
                const makeSource = (url) => ({
                    url: new URL(url, location.href).href,
                    size: catalog.size,
                    sha256: catalog.sha256,
                    allowedOrigins: [location.origin],
                });
                const transport = new WorkerTransport(
                    '../../pyright-worker/dist/pyright_worker.js',
                    {
                        boardStubs: false,
                        stubPackageCatalog: makeSource('/__test__/redirect-catalog'),
                    },
                );
                await transport.connect();
                const rejectedError = transport.assetFallbacks[0]?.error;
                transport.close();
                return {success: true, rejectedError};
            },

            async 'remote-runtime-cache-and-offline-rollback'() {
                const cacheName = `runtime-test-${crypto.randomUUID()}`;
                const storageKey = `runtime-test-${crypto.randomUUID()}`;
                const options = {
                    bundledWorkerUrl: '../../pyright-worker/dist/pyright_worker.js',
                    manifestUrl: new URL(
                        '../../pyright-worker/assets/runtime-manifest.json',
                        location.href,
                    ).href,
                    allowedOrigins: [location.origin],
                    cacheName,
                    storageKey,
                };
                const start = async (candidate) => {
                    const transport = new WorkerTransport(candidate.workerUrl, {
                        boardStubs: false,
                    });
                    await transport.connect();
                    const protocolVersion = transport.protocolVersion;
                    transport.close();
                    return protocolVersion;
                };

                await caches.delete(cacheName);
                localStorage.removeItem(storageKey);
                const remote = await startWorkerRuntime(options, start);
                const originalFetch = globalThis.fetch;
                let offline;
                try {
                    globalThis.fetch = async () => {
                        throw new TypeError('simulated offline');
                    };
                    offline = await startWorkerRuntime(options, start);
                } finally {
                    globalThis.fetch = originalFetch;
                    await caches.delete(cacheName);
                    localStorage.removeItem(storageKey);
                }
                return {
                    success: true,
                    remoteSource: remote.source,
                    remoteProtocol: remote.value,
                    offlineSource: offline.source,
                    offlineProtocol: offline.value,
                    offlineFallbacks: offline.fallbacks,
                };
            },

            async 'invalid-runtime-uses-bundled-fallback'() {
                const cacheName = `runtime-test-${crypto.randomUUID()}`;
                const selected = await startWorkerRuntime({
                    bundledWorkerUrl: '../../pyright-worker/dist/pyright_worker.js',
                    manifestUrl: new URL('/__test__/redirect-catalog', location.href).href,
                    allowedOrigins: [location.origin],
                    cacheName,
                    storageKey: `runtime-test-${crypto.randomUUID()}`,
                }, async (candidate) => {
                    const transport = new WorkerTransport(candidate.workerUrl, {
                        boardStubs: false,
                    });
                    await transport.connect();
                    const protocolVersion = transport.protocolVersion;
                    transport.close();
                    return protocolVersion;
                });
                await caches.delete(cacheName);
                return {
                    success: true,
                    source: selected.source,
                    protocolVersion: selected.value,
                    fallbacks: selected.fallbacks,
                };
            },

            async 'verbose-logging'() {
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js', {
                    verboseOutput: true,
                });
                await t.connect();
                t.close();
                return {success: true};
            },

            async 'lsp-init'() {
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                const {initResponse} = await connectAndInit(t);
                const caps = initResponse.result?.capabilities ? Object.keys(initResponse.result.capabilities) : [];
                t.close();
                return {success: true, capabilities: caps};
            },

            async diagnostics() {
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                await connectAndInit(t);

                const diagResult = await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error('Diagnostics timeout')), 30000);
                    t.subscribe((msgStr) => {
                        const msg = JSON.parse(msgStr);
                        if (msg.method === 'textDocument/publishDiagnostics') {
                            const diags = msg.params?.diagnostics || [];
                            if (diags.length > 0) {
                                clearTimeout(timeout);
                                resolve({diagnosticCount: diags.length, message: diags[0].message});
                            }
                        }
                    });

                    t.send(JSON.stringify({
                        jsonrpc: '2.0', method: 'textDocument/didOpen',
                        params: {
                            textDocument: {
                                uri: 'file:///workspace/main.py', languageId: 'python',
                                version: 1, text: 'x: int = "hello"\nprint(x)\n',
                            },
                        },
                    }));
                });

                t.close();
                return {success: true, ...diagResult};
            },

            async close() {
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                await t.connect();
                t.close();
                return {success: true, connectedAfterClose: t.isConnected()};
            },

            async 'string-messages'() {
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                await t.connect();

                const received = [];
                t.subscribe((msg) => received.push(msg));

                // Send LSP initialize
                t.send(JSON.stringify({
                    jsonrpc: '2.0', id: 1, method: 'initialize',
                    params: {
                        processId: null, rootUri: 'file:///workspace',
                        capabilities: {},
                        workspaceFolders: [{uri: 'file:///workspace', name: 'workspace'}],
                    },
                }));

                // Wait for at least one response
                await new Promise((resolve) => {
                    const check = setInterval(() => {
                        if (received.length > 0) {clearInterval(check); resolve();}
                    }, 100);
                    setTimeout(() => {clearInterval(check); resolve();}, 10000);
                });

                const allStrings = received.every(m => typeof m === 'string');
                t.close();
                return {success: true, allStrings, messageCount: received.length};
            },

            async 'simple-client'() {
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                await t.connect();

                const client = new SimpleLSPClient({rootUri: 'file:///workspace', timeout: 10000});
                await client.connect(t);

                const hasCapabilities = client.serverCapabilities !== null;

                // Open a file with a type error and wait for diagnostics
                const diagPromise = new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error('Diag timeout')), 30000);
                    client.onNotification((method, params) => {
                        if (method === 'textDocument/publishDiagnostics') {
                            const diags = params?.diagnostics || [];
                            if (diags.length > 0) {
                                clearTimeout(timeout);
                                resolve(diags.length);
                            }
                        }
                    });
                });

                client.notify('textDocument/didOpen', {
                    textDocument: {
                        uri: 'file:///workspace/test.py', languageId: 'python',
                        version: 1, text: 'x: int = "hello"\n',
                    },
                });

                const diagnosticCount = await diagPromise;
                await client.disconnect();
                t.close();
                return {success: true, hasCapabilities, diagnosticCount};
            },

            async 'generated-config'() {
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                await t.connect();
                const content = await t.readGeneratedConfig();
                t.close();
                return {
                    success: true,
                    hasToolSection: content.includes('[tool.pyright]'),
                    hasStubPath: content.includes('stubPath = "/typings"'),
                    isQuietByDefault: content.includes('verboseOutput = false'),
                };
            },

            async 'workspace-files'() {
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                await t.connect();
                const path = 'runtime/helpers.py';
                t.syncWorkspaceFile(path, 'answer = 42\n');
                const afterSync = await t.debugListFs('/workspace', 3);
                t.deleteWorkspaceFile(path);
                const afterDelete = await t.debugListFs('/workspace', 3);
                t.close();
                return {
                    success: true,
                    foundAfterSync: afterSync.entries.some((entry) =>
                        entry.path === `/workspace/${path}` && entry.kind === 'file'
                    ),
                    absentAfterDelete: !afterDelete.entries.some((entry) =>
                        entry.path === `/workspace/${path}`
                    ),
                };
            },

            async 'stub-package-catalog'() {
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                await t.connect();
                const packages = await t.listStubPackages({
                    family: 'micropython',
                    version: '1.28.0',
                    port: 'esp32',
                });
                t.close();
                const esp32 = packages.find((entry) =>
                    entry.packageName === 'micropython-esp32-stubs'
                );
                const versions = packages.flatMap((entry) =>
                    (entry.versions || []).map((release) => release.version)
                );
                return {
                    success: true,
                    packageCount: packages.length,
                    esp32LatestVersion: esp32?.latestVersion || '',
                    esp32VersionCount: esp32?.versions?.length || 0,
                    allVersionsMatchRequestedRuntime: versions.every((version) =>
                        version.startsWith('1.28.')
                    ),
                    includesStdlib: packages.some((entry) =>
                        entry.packageName === 'micropython-stdlib-stubs'
                    ),
                    postReleaseVersions: versions.filter((version) => /\.post\d+/i.test(version)),
                    wildcardVersionCount: versions.filter((version) => version.endsWith('.*')).length,
                    errors: packages.filter((entry) => entry.error).map((entry) => entry.error),
                };
            },

            async 'stub-package-default-firmware'() {
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                await t.connect();
                try {
                    const catalog = await t.getStubPackageCatalog();
                    const defaultLine = catalog.defaultRuntimeVersion.split('.').slice(0, 2).join('.');
                    return {
                        success: true,
                        availableRuntimeVersions: catalog.availableRuntimeVersions,
                        defaultRuntimeVersion: catalog.defaultRuntimeVersion,
                        packageCount: catalog.packages.length,
                        allPackagesMatchDefault: catalog.packages.every((entry) =>
                            entry.family === 'micropython'
                            && entry.runtimeVersions.some((version) =>
                                version.split('.').slice(0, 2).join('.') === defaultLine
                            )
                        ),
                    };
                } finally {
                    t.close();
                }
            },

            async 'stub-package-rejects-uncatalogued'() {
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                await t.connect();
                try {
                    await t.installStubPackage('micropython-not-a-real-port-stubs');
                    throw new Error('Uncatalogued stub package installation unexpectedly succeeded');
                } catch (error) {
                    return {
                        success: true,
                        message: error instanceof Error ? error.message : String(error),
                    };
                } finally {
                    t.close();
                }
            },

            async 'stub-package-installs-unlisted-extra'() {
                const packageName = 'types-requests';
                const t = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                await t.connect();
                await t.clearStubPackages(packageName);
                const installed = await t.installStubPackage(packageName);
                const cached = await t.listInstalledStubPackages();
                await t.clearStubPackages(packageName);
                t.close();
                return {
                    success: true,
                    version: installed.version,
                    persisted: cached.some((entry) =>
                        entry.packageName === packageName
                        && entry.version === installed.version
                        && entry.active
                    ),
                };
            },

            async 'stub-package-install'() {
                const packageName = 'micropython-webassembly-stubs';
                const first = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js');
                await first.connect();
                await first.clearStubPackages(packageName);
                const catalog = await first.listStubPackages();
                const available = catalog.find((entry) => entry.packageName === packageName);
                const version = available?.latestVersion;
                if (!version) throw new Error(`No current PyPI version found for ${packageName}`);
                const installed = await first.installStubPackage(packageName, `==${version}`);
                const otherBoard = catalog.find((entry) =>
                    entry.packageName === 'micropython-esp32-stubs'
                );
                await first.installStubPackage(
                    otherBoard.packageName,
                    `==${otherBoard.latestVersion}`,
                );
                first.close();

                const second = new WorkerTransport('../../pyright-worker/dist/pyright_worker.js', {
                    boardStubs: false,
                    boardStubPackage: {packageName, version},
                });
                await second.connect();
                const cached = await second.listInstalledStubPackages();
                const filesystem = await second.debugListFs('/typings', 2);
                const extras = await second.debugListFs('/extra', 2);
                await second.clearStubPackages(packageName);
                await second.clearStubPackages(otherBoard.packageName);
                second.close();

                return {
                    success: true,
                    version: installed.version,
                    persisted: cached.some((entry) =>
                        entry.packageName === packageName
                        && entry.version === version
                        && entry.active
                    ),
                    mounted: filesystem.entries.some((entry) =>
                        entry.kind === 'file' && entry.path.endsWith('/micropython.pyi')
                    ),
                    dependencyMounted: filesystem.entries.some((entry) =>
                        entry.kind === 'file'
                        && /\/_mpy_shed\/mp_implementation\.pyi?$/.test(entry.path)
                    ),
                    otherBoardExcluded: !extras.entries.some((entry) =>
                        entry.path.includes('/micropython-esp32-stubs')
                    ),
                };
            },
        };

        window.runTest = async function (name) {
            log(`Running test: ${name}`);
            try {
                const result = await tests[name]();
                log(`PASS: ${name} → ${JSON.stringify(result)}`);
                return result;
            } catch (err) {
                log(`FAIL: ${name} → ${err.message}`);
                throw err;
            }
        };
    </script>
</body>

</html>
