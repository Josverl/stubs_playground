<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mp-codemirror — CDN consumer harness</title>
    <!--
      Minimal standalone harness that embeds the reusable LSP components using
    ONLY the public API (@mp-typing/lsp-client + the Pyright worker).
      It deliberately does not import app.js, ui/, storage/, or share.js.

      Sources are switchable via query params so the same page validates both
      local files (default, used by CI before a release exists) and the
      published npm packages. CDN mode requires an explicit version:

        ?client=cdn&clientVersion=0.3.1
        ?worker=cdn&workerVersion=0.4.0

      See docs/api/lsp-client.md for the full integration contract.
    -->
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
        }

        #status {
            padding: 6px 10px;
            font: 13px/1.4 monospace;
            background: #f3f3f3;
            border-bottom: 1px solid #ddd;
        }

        #editor {
            height: 60vh;
        }

        .cm-editor {
            height: 100%;
        }
    </style>

    <!-- The consumer supplies the LSP client's CodeMirror peer dependencies. -->
    <script type="importmap">
    {
        "imports": {
            "codemirror": "https://esm.sh/codemirror@6.0.1?deps=@codemirror/autocomplete@6.20.1,@codemirror/commands@6.8.0,@codemirror/language@6.12.3,@codemirror/lint@6.9.5,@codemirror/search@6.5.11,@codemirror/state@6.6.0,@codemirror/view@6.41.1",
            "@codemirror/lang-python": "https://esm.sh/@codemirror/lang-python@6.2.1?deps=@codemirror/autocomplete@6.20.1,@codemirror/language@6.12.3,@codemirror/state@6.6.0,@codemirror/view@6.41.1,@lezer/common@1.5.2,@lezer/python@1.1.18",
            "@codemirror/autocomplete": "https://esm.sh/@codemirror/autocomplete@6.20.1?deps=@codemirror/language@6.12.3,@codemirror/state@6.6.0,@codemirror/view@6.41.1,@lezer/common@1.5.2",
            "@codemirror/language": "https://esm.sh/@codemirror/language@6.12.3?deps=@codemirror/state@6.6.0,@codemirror/view@6.41.1,@lezer/common@1.5.2",
            "@codemirror/lint": "https://esm.sh/@codemirror/lint@6.9.5?deps=@codemirror/state@6.6.0,@codemirror/view@6.41.1",
            "@codemirror/state": "https://esm.sh/@codemirror/state@6.6.0",
            "@codemirror/view": "https://esm.sh/@codemirror/view@6.41.1?deps=@codemirror/state@6.6.0"
        }
    }
    </script>
</head>

<body>
    <div id="status">initializing…</div>
    <div id="editor"></div>

    <script>
        window.__lspReady = false;
        window.__lspFailed = false;
        window.__diagnostics = [];
        window.__workspaceDiagnostics = [];
        window.__completionLabels = [];
        window.__hover = null;

        function recordStartupFailure(error) {
            if (window.__lspReady) return;
            window.__lspFailed = true;
            window.__lspError = String(error?.stack || error?.message || error);
        }

        window.addEventListener('error', (event) => recordStartupFailure(event.error || event.message));
        window.addEventListener('unhandledrejection', (event) => recordStartupFailure(event.reason));
    </script>

    <script type="module">
        import {EditorView, basicSetup} from 'codemirror';
        import {Compartment} from '@codemirror/state';
        import {python} from '@codemirror/lang-python';
        import {diagnosticCount} from '@codemirror/lint';

        const params = new URLSearchParams(location.search);
        const CLIENT_PACKAGE = '@mp-typing/lsp-client';
        const WORKER_PACKAGE = '@mp-typing/pyright-worker';
        const cdn = (pkg, version, path) =>
            `https://cdn.jsdelivr.net/npm/${pkg}@${version}/${path}`;
        // Required rather than defaulted so a stale pinned version cannot go unnoticed.
        const requireVersion = (name) => {
            const value = params.get(name);
            if (!value) throw new Error(`Missing "${name}" query parameter for CDN mode`);
            return value;
        };
        const statusEl = document.getElementById('status');
        const setStatus = (msg) => {statusEl.textContent = msg;};

        // Resolve the LSP client module URL (local by default, CDN on request).
        const clientUrl = params.get('client') === 'cdn'
            ? cdn(CLIENT_PACKAGE, requireVersion('clientVersion'), 'src/index.js')
            : '../src/index.js';

        // Resolve the worker URL. A cross-origin (CDN) worker must be wrapped in
        // a same-origin Blob that importScripts() the remote bundle.
        function makeSameOriginWorkerUrl(remoteUrl) {
            const shim = `importScripts(${JSON.stringify(remoteUrl)});`;
            return URL.createObjectURL(new Blob([shim], {type: 'application/javascript'}));
        }
        const workerUrl = params.get('worker') === 'cdn'
            ? makeSameOriginWorkerUrl(
                cdn(WORKER_PACKAGE, requireVersion('workerVersion'), 'dist/pyright_worker.js'),
            )
            : '../../pyright-worker/dist/pyright_worker.js';

        const sourceMode = {
            client: params.get('client') === 'cdn' ? 'cdn' : 'local',
            worker: params.get('worker') === 'cdn' ? 'cdn' : 'local',
        };

        async function loadBoardStubs(board) {
            if (!board || board === 'default') {
                return undefined;
            }
            if (board === 'cpython') {
                return false;
            }

            const base = sourceMode.worker === 'cdn'
                ? cdn(WORKER_PACKAGE, requireVersion('workerVersion'), 'assets')
                : '../../pyright-worker/assets';
            const response = await fetch(`${base}/stubs-${board}.zip`);
            if (!response.ok) {
                throw new Error(`Failed to load ${board} stubs: HTTP ${response.status}`);
            }
            return response.arrayBuffer();
        }

        // Includes a deterministic type error plus MicroPython symbols for
        // completion and hover probes.
        const INITIAL = [
            'import machine',
            'pin = machine.Pin(2, machine.Pin.OUT)',
            'x: int = "not an int"',
            '',
        ].join('\n');
        const FILE_URI = 'file:///workspace/main.py';

        // Signals consumed by the Playwright test.
        window.__board = params.get('board') || 'default';

        try {
            const lsp = await import(clientUrl);
            window.__publicExports = Object.keys(lsp).sort();

            const boardStubs = await loadBoardStubs(window.__board);
            const workspaceMode = params.get('scope') === 'workspace';
            const clientConfig = {
                workerUrl,
                boardStubs,
                diagnosticMode: workspaceMode ? 'workspace' : 'openFilesOnly',
            };
            if (workspaceMode) {
                clientConfig.workspaceFiles = {
                    'unopened.py': 'workspace_error: int = "not an int"\n',
                };
                clientConfig.onWorkspaceDiagnosticsChange = (diagnostics) => {
                    window.__workspaceDiagnostics = diagnostics || [];
                };
            }
            const {client, pyrightVersion} = await lsp.createLSPClient(clientConfig);

            const lspCompartment = new Compartment();
            const view = new EditorView({
                doc: INITIAL,
                parent: document.getElementById('editor'),
                extensions: [basicSetup, python(), lspCompartment.of([])],
            });
            window.__editorDiagnosticCount = () => diagnosticCount(view.state);

            view.dispatch({
                effects: lspCompartment.reconfigure(
                    lsp.createLSPPlugin(client, view, {
                        fileUri: FILE_URI,
                        initialContent: INITIAL,
                        onDiagnosticsChange: async (diags) => {
                            window.__diagnostics = diags || [];
                            setStatus(`Pyright ${pyrightVersion || '?'} — ${window.__diagnostics.length} diagnostic(s)`);

                            if (window.__probesStarted || window.__diagnostics.length === 0) {
                                return;
                            }
                            window.__probesStarted = true;

                            const completion = await client.request('textDocument/completion', {
                                textDocument: {uri: FILE_URI},
                                position: {line: 1, character: 14},
                                context: {triggerKind: 2, triggerCharacter: '.'},
                            });
                            const completionItems = completion?.items || completion || [];
                            window.__completionLabels = completionItems.map((item) => item.label);

                            window.__hover = await client.request('textDocument/hover', {
                                textDocument: {uri: FILE_URI},
                                position: {line: 1, character: 15},
                            });
                            window.__probesComplete = true;
                        },
                    }),
                ),
            });

            window.__lspReady = true;
            setStatus(`LSP ready — Pyright ${pyrightVersion || '?'} (client: ${sourceMode.client}, worker: ${sourceMode.worker}, board: ${window.__board})`);
        } catch (err) {
            window.__lspFailed = true;
            window.__lspError = String(err && err.stack ? err.stack : err);
            setStatus(`LSP failed: ${err}`);
            console.error('Harness LSP init failed:', err);
        }
    </script>
</body>

</html>
